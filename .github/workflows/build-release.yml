name: Build Afnon Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Afnon-Algeria-Medea-Glass-v2.zip"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          rm -rf extracted
          unzip -q Afnon-Algeria-Medea-Glass-v2.zip -d extracted
          cp -a extracted/. .

      - name: Apply Algeria/Medea, IPTV audio ducking, and background test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          prefs = Path("app/src/main/java/tv/afnon/home/Prefs.java")
          text = prefs.read_text()
          old = 'of(c).getString("city", "cairo")'
          new = 'of(c).getString("city", "medea")'
          if old not in text:
              raise SystemExit("Expected city default not found")
          prefs.write_text(text.replace(old, new, 1))

          now = Path("app/src/main/java/tv/afnon/home/NowActivity.java")
          text = now.read_text()
          old = 'AudioManager.AUDIOFOCUS_GAIN_TRANSIENT)'
          new = 'AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK)'
          if old not in text:
              raise SystemExit("Expected audio focus mode not found")
          now.write_text(text.replace(old, new, 1))

          main = Path("app/src/main/java/tv/afnon/home/MainActivity.java")
          text = main.read_text()
          old = '''    @Override\n    protected void onCreate(Bundle state) {\n        super.onCreate(state);\n        runTest(getIntent());\n    }\n'''
          new = '''    @Override\n    protected void onCreate(Bundle state) {\n        super.onCreate(state);\n        runTest(getIntent());\n        // Background adhan test build: give the user time to press Home and open IPTV.\n        // The AccessibilityService owns the timer, so the test continues after this Activity is paused.\n        new Handler(Looper.getMainLooper()).postDelayed(() -> {\n            if (RemoteKeys.watch != null) {\n                RemoteKeys.watch.test("announce", 8000);\n                Toast.makeText(this, "اختبار الأذان: اخرج بزر Home الآن", Toast.LENGTH_LONG).show();\n            } else {\n                Toast.makeText(this, "خدمة Afnon remote buttons غير مفعلة", Toast.LENGTH_LONG).show();\n            }\n        }, 1000);\n    }\n'''
          if old not in text:
              raise SystemExit("Expected MainActivity onCreate block not found")
          main.write_text(text.replace(old, new, 1))
          PY

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Check Java version
        run: java -version

      - name: Build Signed APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afnon-Algeria-Medea-Background-Test
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "Afnon Algeria Médéa Background Test $TAG" \
            --notes "Temporary test build: after opening Afnon, the AccessibilityService schedules a test announcement 8 seconds later so the user can press Home and open IPTV. Also includes Algeria/Médéa default and IPTV audio ducking during adhan."
