name: Build Afnon Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Afnon-Algeria-Medea-Glass-v2.zip"
      - ".github/workflows/build-release.yml"
      - "patches/reliable-background-adhan/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          rm -rf extracted
          unzip -q Afnon-Algeria-Medea-Glass-v2.zip -d extracted
          cp -a extracted/. .

      - name: Apply reliable background adhan patch
        run: bash patches/reliable-background-adhan/apply.sh

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Signed APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afnon-Algeria-Medea-Reliable-Adhan
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "Afnon Algeria Médéa Reliable Background Adhan $TAG" \
            --notes "Background adhan uses AlarmManager + foreground media playback service with IPTV audio ducking. Includes a one-time 15-second background test after opening Afnon."
