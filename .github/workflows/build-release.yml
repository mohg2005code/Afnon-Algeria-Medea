name: Build Afnon Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Afnon-Algeria-Medea-Glass-v2.zip"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          rm -rf extracted
          unzip -q Afnon-Algeria-Medea-Glass-v2.zip -d extracted
          cp -a extracted/. .

      - name: Apply Algeria/Medea, IPTV audio ducking, and robust background test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          prefs = Path("app/src/main/java/tv/afnon/home/Prefs.java")
          text = prefs.read_text()
          old = 'of(c).getString("city", "cairo")'
          new = 'of(c).getString("city", "medea")'
          if old not in text:
              raise SystemExit("Expected city default not found")
          prefs.write_text(text.replace(old, new, 1))

          now = Path("app/src/main/java/tv/afnon/home/NowActivity.java")
          text = now.read_text()
          old = 'AudioManager.AUDIOFOCUS_GAIN_TRANSIENT)'
          new = 'AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK)'
          if old not in text:
              raise SystemExit("Expected audio focus mode not found")
          now.write_text(text.replace(old, new, 1))

          remote = Path("app/src/main/java/tv/afnon/home/RemoteKeys.java")
          text = remote.read_text()
          if 'watch.test("announce", 8000);' not in text:
              pattern = r'(watch\s*=\s*new\s+PrayerWatch\(this\);\s*watch\.start\(\);)'
              replacement = r'\1\n        // Background test: schedule after AccessibilityService is actually connected.\n        watch.test("announce", 8000);'
              text2, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit("Could not find PrayerWatch startup")
              remote.write_text(text2)

          main = Path("app/src/main/java/tv/afnon/home/MainActivity.java")
          text = main.read_text()
          if 'اختبار الأذان: اخرج بزر Home الآن' not in text:
              marker = 'runTest(getIntent());'
              if marker not in text:
                  raise SystemExit("Could not find MainActivity test hook")
              text = text.replace(marker, marker + '\n        Toast.makeText(this, "اختبار الأذان: اخرج بزر Home الآن", Toast.LENGTH_LONG).show();', 1)
              main.write_text(text)
          PY

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Check Java version
        run: java -version

      - name: Build Signed APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afnon-Algeria-Medea-Background-Test
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "Afnon Algeria Médéa Background Test $TAG" \
            --notes "Temporary test build: the AccessibilityService schedules a test announcement 8 seconds after the service actually connects, so the user can press Home and open IPTV. Also includes Algeria/Médéa default and IPTV audio ducking during adhan."
