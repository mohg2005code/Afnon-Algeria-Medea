name: Build Afnon Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Afnon-Algeria-Medea-Glass-v2.zip"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          rm -rf extracted
          unzip -q Afnon-Algeria-Medea-Glass-v2.zip -d extracted
          cp -a extracted/. .

      - name: Apply Algeria/Medea and IPTV audio ducking
        run: |
          python3 - <<'PY'
          from pathlib import Path

          prefs = Path("app/src/main/java/tv/afnon/home/Prefs.java")
          text = prefs.read_text()
          old = 'of(c).getString("city", "cairo")'
          new = 'of(c).getString("city", "medea")'
          if old not in text:
              raise SystemExit("Expected city default not found")
          prefs.write_text(text.replace(old, new, 1))

          now = Path("app/src/main/java/tv/afnon/home/NowActivity.java")
          text = now.read_text()
          old = 'AudioManager.AUDIOFOCUS_GAIN_TRANSIENT)'
          new = 'AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK)'
          if old not in text:
              raise SystemExit("Expected audio focus mode not found")
          now.write_text(text.replace(old, new, 1))
          PY

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Check Java version
        run: java -version

      - name: Build Signed APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afnon-Algeria-Medea-Release
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "Afnon Algeria Médéa $TAG" \
            --notes "Afnon Android TV — Algeria/Médéa default + IPTV audio ducking during adhan. Signed debug APK for direct installation."
